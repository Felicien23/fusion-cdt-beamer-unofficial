# Build the starter and the demonstration from a clean checkout, lint the LaTeX
# sources, check the logs, and upload the PDFs as a build artifact.
name: Build

on:
  # Branch pushes only: version tags are built by release.yml, which calls
  # this workflow, so a tag push does not build twice.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

# Build only: no write access and no personal access tokens are needed.
permissions:
  contents: read

jobs:
  build:
    # Ubuntu 24.04 provides TeX Live 2023, the toolchain the theme is tested with.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-pictures \
            latexmk chktex librsvg2-bin curl

      - name: Show tool versions
        run: |
          lualatex --version | head -n 1
          latexmk -v | sed -n 2p
          chktex --version | head -n 1
          rsvg-convert --version

      # Downloads the logo, builds both PDFs, runs ChkTeX, checks that the
      # version declarations agree, and fails on theme warnings (missing logo
      # or font), undefined references, overfull boxes and BibTeX warnings.
      - name: Build and check
        run: make check

      - name: Upload the compiled PDFs
        uses: actions/upload-artifact@v6
        with:
          name: fusion-cdt-beamer-unofficial-pdfs
          path: |
            demo/demo.pdf
            starter/main.pdf
          if-no-files-found: error
